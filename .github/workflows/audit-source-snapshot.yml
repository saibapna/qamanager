name: Audit source checkout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-source-snapshot.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: qamanager-full-source
          path: |
            .
            !**/node_modules/**
            !**/dist/**
            !.git/**
          retention-days: 1
