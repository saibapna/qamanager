name: Audit source snapshot
on:
  push:
    branches:
      - fix/master-audit-p0-p1-20261121
    paths:
      - '.github/workflows/audit-source-snapshot.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: qamanager-source
          path: |
            .
            !**/node_modules/**
            !**/dist/**
            !.git/**
          retention-days: 1
