name: Cloudflare production browser smoke
on:
  workflow_run:
    workflows: ["Build Cloudflare Hono Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install pinned Playwright Test
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.65.1 @axe-core/playwright@4.14.0
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise production login, keyboard focus, mobile layout and axe WCAG 2.1 AA
        run: npx playwright test --config=.github/playwright.production.config.mjs
