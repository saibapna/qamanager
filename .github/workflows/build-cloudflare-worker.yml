name: Build Cloudflare Hono Worker
on:
  pull_request:
    paths:
      - 'admin-ui/**'
      - '.github/scripts/deploy-qamanager-worker.mjs'
      - '.github/workflows/build-cloudflare-worker.yml'
  push:
    branches: [main, 'fix/master-audit-p0-p1-20261121']
    paths:
      - 'admin-ui/**'
      - '.github/scripts/deploy-qamanager-worker.mjs'
      - '.github/workflows/build-cloudflare-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qamanager-worker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: admin-ui
      - name: Test Worker SPA and API routing
        run: node --test tests/worker-routing.test.mjs
        working-directory: admin-ui
      - name: Compile React UI
        run: npm run build
        working-directory: admin-ui
      - name: Bundle Hono and UI into one Cloudflare Worker
        run: npm run build:worker
        working-directory: admin-ui
      - name: Assert pg-cloudflare workerd path included in Worker bundle
        run: grep -q 'cloudflare:sockets' worker-dist/qamanager-worker.mjs
        working-directory: admin-ui
      - uses: actions/upload-artifact@v4
        with:
          name: qamanager-hono-worker
          path: admin-ui/worker-dist/qamanager-worker.mjs
          if-no-files-found: error
      - name: Deploy Cloudflare Worker and smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/deploy-qamanager-worker.mjs
