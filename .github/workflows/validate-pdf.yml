name: Validate PDF 1=1
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: node src/generate.js data/sample-sirikap.json output/hasil-ulo.pdf
      - run: python scripts/validate.py fixtures/lampiran.pdf output/hasil-ulo.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: output, path: output/ }
