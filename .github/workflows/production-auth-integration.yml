name: Production authentication integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-auth-integration.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login ephemeral no-project account and verify auth middleware
        shell: bash
        env:
          SMOKE_EMAIL: "qamanager-smoke-20261121@example.invalid"
          SMOKE_PASSWORD: "PJVXK0nXN13CMnbD0DtIjfPrAEz47bW2oogU9chC-B4"
        run: |
          set -euo pipefail
          base='https://qamanager.saipulbahri-it.workers.dev'
          code="$(jq -n --arg email "$SMOKE_EMAIL" --arg password "$SMOKE_PASSWORD" '{email:$email,password:$password}' | curl --silent --show-error --max-time 30 -H 'Content-Type: application/json' --data-binary @- -o /tmp/qa-login.json -w '%{http_code}' "$base/api/auth/login")"
          echo "Valid test login HTTP $code"
          if [ "$code" != '200' ]; then jq -c '{error:.error}' /tmp/qa-login.json; exit 1; fi
          token="$(jq -r '.accessToken // empty' /tmp/qa-login.json)"
          refresh="$(jq -r '.refreshToken // empty' /tmp/qa-login.json)"
          test "${#token}" -gt 40
          test "${#refresh}" -gt 40
          jq -e '.user.email == env.SMOKE_EMAIL and .user.projects == []' /tmp/qa-login.json
          code2="$(curl --silent --show-error --max-time 30 -H "Authorization: Bearer $token" -o /tmp/qa-projects.json -w '%{http_code}' "$base/api/projects")"
          echo "Authenticated projects HTTP $code2"
          test "$code2" = '200'
          jq -e 'type == "array" and length == 0' /tmp/qa-projects.json
          echo "Valid login, JWT and project isolation smoke passed"
