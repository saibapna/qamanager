name: Production auth crypto diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-auth-crypto-check.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Cloudflare runtime PBKDF2 and admin record visibility
        shell: bash
        run: |
          set -euo pipefail
          url='https://qamanager.saipulbahri-it.workers.dev/api/health/auth-check'
          code="$(curl --silent --show-error --max-time 30 -o /tmp/auth-check.json -w '%{http_code}' "$url")"
          echo "HTTP $code"
          cat /tmp/auth-check.json
          jq . /tmp/auth-check.json
          test "$code" = "200"
          jq -e '.ok == true and .crypto_pbkdf2 == true and .admin_record_visible == true' /tmp/auth-check.json
          echo 'Worker runtime PBKDF2 and admin visibility OK'
