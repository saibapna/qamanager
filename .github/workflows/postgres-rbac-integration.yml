name: PostgreSQL RBAC integration
on:
  pull_request:
    paths:
      - 'admin-ui/functions/api/**'
      - 'admin-ui/tests/rbac-postgres-integration.test.mjs'
      - '.github/workflows/postgres-rbac-integration.yml'
  push:
    branches: [main]
    paths:
      - 'admin-ui/functions/api/**'
      - 'admin-ui/tests/rbac-postgres-integration.test.mjs'
      - '.github/workflows/postgres-rbac-integration.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  rbac-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qa_rbac_ci
          POSTGRES_USER: qa_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_test -d qa_rbac_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: admin-ui
        run: npm install --no-audit --no-fund
      - name: Run authenticated Hono + PostgreSQL security integration
        working-directory: admin-ui
        env:
          QA_INTEGRATION_DATABASE_URL: postgresql://qa_test:isolated-ci-only@127.0.0.1:5432/qa_rbac_ci
        run: node --test tests/rbac-postgres-integration.test.mjs
