openapi: 3.1.0
info:
  title: ULO/UAT Manager API
  version: 1.0.0
  description: Cloudflare Hono ULO/UAT staging API; PDF perbandingan SHA-256, bukan visual SSIM.
servers:
- url: https://qamanager.saipulbahri-it.workers.dev/api
- url: http://localhost:3000/api
tags:
- name: Auth
- name: Projects
- name: Templates
- name: Aplikasi
- name: Sesi
- name: Validate
security:
- CookieAuth: []
- BearerAuth: []
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: qa_access
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    LoginInput:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        nama:
          type: string
        projects:
          type: array
          items:
            $ref: '#/components/schemas/UserProject'
    UserProject:
      type: object
      properties:
        project_id:
          type: integer
        kode:
          type: string
        nama:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - TESTER
          - WITNESS
          - APPROVER
          - AUDITOR
    Project:
      type: object
      properties:
        id:
          type: integer
        kode:
          type: string
        nama:
          type: string
        instansi:
          type: string
        bidang:
          type: string
        aktif:
          type: boolean
    Template:
      type: object
      properties:
        id:
          type: integer
        versi:
          type: string
        nama:
          type: string
        published:
          type: boolean
    Sesi:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum:
          - DRAFT
          - FINAL
          - SIGNED
    Item:
      type: object
      properties:
        no:
          type: string
        kategori:
          type: string
        kebutuhan:
          type: string
        hasil:
          type: string
        status:
          type: string
          enum:
          - PASS
          - FAIL
          - BELUM
paths:
  /health:
    get:
      summary: Health check API (GET /api/health)
      security: []
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login sukses
        '401':
          description: Kredensial salah
  /auth/me:
    get:
      summary: Profil user
      responses:
        '200':
          description: OK
  /projects:
    get:
      summary: List project
      responses:
        '200':
          description: OK
    post:
      summary: Buat project
      responses:
        '201':
          description: OK
  /projects/{projectId}:
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Detail project
      responses:
        '200':
          description: OK
    patch:
      summary: Update project
      responses:
        '200':
          description: OK
    delete:
      summary: Arsipkan project (soft delete)
      responses:
        '204':
          description: OK
  /projects/{projectId}/templates:
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List template
      responses:
        '200':
          description: OK
    post:
      summary: Buat template
      responses:
        '201':
          description: OK
  /templates/{templateId}:
    parameters:
    - name: templateId
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Detail template
      responses:
        '200':
          description: OK
    patch:
      summary: Update template
      responses:
        '200':
          description: OK
    delete:
      summary: Hapus template
      responses:
        '204':
          description: OK
  /templates/{templateId}/publish:
    post:
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: integer
      summary: Publish template
      responses:
        '200':
          description: OK
  /templates/{templateId}/fixtures:
    post:
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: integer
      summary: Upload fixture baseline
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: OK
  /projects/{projectId}/aplikasi:
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List aplikasi
      responses:
        '200':
          description: OK
    post:
      summary: Buat aplikasi
      responses:
        '201':
          description: OK
  /aplikasi/{aplikasiId}/sesi:
    parameters:
    - name: aplikasiId
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List sesi
      responses:
        '200':
          description: OK
    post:
      summary: Buat sesi
      responses:
        '201':
          description: OK
  /sesi/{sesiId}:
    parameters:
    - name: sesiId
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Detail sesi
      responses:
        '200':
          description: OK
    patch:
      summary: Update sesi
      responses:
        '200':
          description: OK
  /sesi/{sesiId}/items:
    put:
      parameters:
      - name: sesiId
        in: path
        required: true
        schema:
          type: integer
      summary: Bulk upsert item
      responses:
        '200':
          description: OK
  /sesi/{sesiId}/pdf:
    post:
      parameters:
      - name: sesiId
        in: path
        required: true
        schema:
          type: integer
      summary: Generate PDF 1=1
      responses:
        '200':
          description: PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /templates/{templateId}/validate:
    post:
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: integer
      summary: Validasi 1=1
      responses:
        '200':
          description: OK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outputPath
              properties:
                outputPath:
                  type: string
                  description: Path PDF output yang tercatat dalam ulo_output pada template ini
  /templates/{templateId}/diff:
    post:
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: integer
      summary: Diff visual SSIM
      responses:
        '200':
          description: OK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outputPath
              properties:
                outputPath:
                  type: string
                  description: Path PDF output yang tercatat dalam ulo_output pada template ini
  /auth/refresh:
    post:
      summary: Rotasi refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token baru
        '401':
          description: Invalid/revoked
  /auth/logout:
    post:
      summary: Cabut refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: OK
  /sesi/{sesiId}/outputs:
    get:
      summary: Daftar PDF ber-versi
      parameters:
      - name: sesiId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
  /sesi/{sesiId}/finalize:
    post:
      summary: Finalisasi hanya jika test plan lengkap, semua item diuji, gate wajib PASS, dan defect terselesaikan
      parameters:
      - name: sesiId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: FINAL
        '422':
          description: Gate belum terpenuhi
/projects/{projectId}/plan:
    parameters:
    - name: projectId
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Baca test plan kanonis per project
      responses:
        '200': {description: Daftar item}
    put:
      summary: Ganti katalog test plan hanya sebelum sesi pertama dibuat (ADMIN)
      responses:
        '200': {description: Tersimpan}
        '409': {description: Plan telah terkunci}
  /projects/{projectId}/dashboard:
    get:
      summary: Dashboard jumlah sesi, status item, defect (scoped project)
      parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200': {description: Statistik}
  /projects/{projectId}/members:
    parameters:
    - name: projectId
      in: path
      required: true
      schema: {type: integer}
    get:
      summary: Daftar anggota dan role ADMIN/AUDITOR
      responses:
        '200': {description: Anggota}
    post:
      summary: Tambah user atau atur role project (ADMIN)
      responses:
        '201': {description: Anggota terpasang}
  /projects/{projectId}/members/{userId}:
    delete:
      summary: Cabut keanggotaan kecuali admin terakhir atau diri sendiri
      parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: integer}
      - name: userId
        in: path
        required: true
        schema: {type: integer}
      responses:
        '204': {description: Dicabut}
        '409': {description: Admin terakhir atau diri sendiri}
  /projects/{projectId}/people:
    parameters:
    - name: projectId
      in: path
      required: true
      schema: {type: integer}
    get:
      summary: Daftar master penguji dan saksi
      responses:
        '200': {description: Daftar personel}
    post:
      summary: Tambah master penguji atau saksi
      responses:
        '201': {description: Personel dibuat}
  /projects/{projectId}/people/{personId}:
    patch:
      summary: Perbarui master penguji atau saksi
      parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: integer}
      - name: personId
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200': {description: Diperbarui}
  /projects/{projectId}/audit:
    get:
      summary: Audit trail append-only dengan pagination offset
      parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: integer}
      - name: offset
        in: query
        required: false
        schema: {type: integer}
      responses:
        '200': {description: Riwayat audit}
  /sesi/{sesiId}/history:
    get:
      summary: Riwayat perubahan hasil test case append-only
      parameters:
      - name: sesiId
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200': {description: Event perubahan}
  /sesi/{sesiId}/defects:
    get:
      summary: Daftar defect pada sesi UAT
      parameters:
      - name: sesiId
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200': {description: Daftar defect}
  /sesi/{sesiId}/defects/{defectId}:
    patch:
      summary: Update severity dan transisi state defect dengan RBAC
      parameters:
      - name: sesiId
        in: path
        required: true
        schema: {type: integer}
      - name: defectId
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200': {description: Defect diperbarui}
        '409': {description: Transisi tidak diizinkan}
  /sesi/{sesiId}/defects/{defectId}/retests:
    parameters:
    - name: sesiId
      in: path
      required: true
      schema: {type: integer}
    - name: defectId
      in: path
      required: true
      schema: {type: integer}
    get:
      summary: Riwayat retest defect
      responses:
        '200': {description: Riwayat retest}
    post:
      summary: Catat retest PASS/FAIL dan perbarui status item (TESTER)
      responses:
        '201': {description: Retest dicatat}
  /sesi/{sesiId}/defects/{defectId}/comments:
    parameters:
    - name: sesiId
      in: path
      required: true
      schema: {type: integer}
    - name: defectId
      in: path
      required: true
      schema: {type: integer}
    get:
      summary: Komentar defect
      responses:
        '200': {description: Komentar}
    post:
      summary: Tambah komentar defect append-only
      responses:
        '201': {description: Komentar tersimpan}
  /sesi/{sesiId}/approvals:
    parameters:
    - name: sesiId
      in: path
      required: true
      schema: {type: integer}
    get:
      summary: Riwayat persetujuan internal
      responses:
        '200': {description: Persetujuan}
    post:
      summary: Rekam keputusan WITNESS lalu APPROVER oleh dua akun berbeda (bukan PKI)
      responses:
        '201': {description: Persetujuan dicatat}
        '403': {description: Separation of duties}
        '409': {description: Urutan atau status tidak valid}
  /sesi/{sesiId}/items/{itemId}/evidence:
    parameters:
    - name: sesiId
      in: path
      required: true
      schema: {type: integer}
    - name: itemId
      in: path
      required: true
      schema: {type: integer}
    get:
      summary: Daftar bukti pada satu item
      responses:
        '200': {description: Bukti}
    post:
      summary: Upload PDF/PNG/JPEG maksimal 4 MiB hanya saat DRAFT
      responses:
        '201': {description: Bukti disimpan}
  /sesi/{sesiId}/items/{itemId}/evidence/{evidenceId}/download:
    get:
      summary: Unduh bukti private dengan pemeriksaan membership
      parameters:
      - name: sesiId
        in: path
        required: true
        schema: {type: integer}
      - name: itemId
        in: path
        required: true
        schema: {type: integer}
      - name: evidenceId
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200':
          description: Konten berkas private
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /sesi/{sesiId}/items/{itemId}/evidence/{evidenceId}:
    delete:
      summary: Hapus bukti DRAFT oleh ADMIN dengan audit trail
      parameters:
      - name: sesiId
        in: path
        required: true
        schema: {type: integer}
      - name: itemId
        in: path
        required: true
        schema: {type: integer}
      - name: evidenceId
        in: path
        required: true
        schema: {type: integer}
      responses:
        '204': {description: Dihapus}
  /templates/{templateId}/fixtures/{fixtureId}/download:
    get:
      summary: Unduh fixture baseline private
      parameters:
      - name: templateId
        in: path
        required: true
        schema: {type: integer}
      - name: fixtureId
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200': {description: PDF fixture}
  /sesi/{sesiId}/outputs/{outputId}/download:
    get:
      summary: Unduh PDF versi tertentu private
      parameters:
      - name: sesiId
        in: path
        required: true
        schema: {type: integer}
      - name: outputId
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200': {description: PDF ber-versi}
