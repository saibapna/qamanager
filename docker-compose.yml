services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ulo_uat
      POSTGRES_USER: ulo
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-ulo_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/schema-auth.sql:/docker-entrypoint-initdb.d/02-auth.sql:ro
      - ./db/seed-projects.sql:/docker-entrypoint-initdb.d/03-projects.sql:ro
      - ./db/seed-templates.sql:/docker-entrypoint-initdb.d/04-templates.sql:ro
      - ./db/seed-users.sql:/docker-entrypoint-initdb.d/05-demo-users.sql:ro
      - ./db/seed-sirikap-items.sql:/docker-entrypoint-initdb.d/06-sirikap.sql:ro
      - ./db/seed-simpeg-items.sql:/docker-entrypoint-initdb.d/07-simpeg.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulo -d ulo_uat"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ulo
      PGPASSWORD: ${LOCAL_DB_PASSWORD:-ulo_local_only}
      PGDATABASE: ulo_uat
      DB_SCHEMA: ulo_uat
      NODE_ENV: development
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-access-secret-32-characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-development-refresh-secret-32-characters}
      WORKER_UPLOAD_DIR: /app/output
    ports: ["3000:3000"]
    volumes:
      - ./output:/app/output
      - ./fixtures:/app/fixtures
    command: ["serve"]
    shm_size: 512m

  worker:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./fixtures:/app/fixtures
      - ./data:/app/data
    command: ["shell"]
    shm_size: 512m

  admin-ui:
    build:
      context: ./admin-ui
    ports: ["5173:5173"]
    depends_on: [api]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  pgdata:
